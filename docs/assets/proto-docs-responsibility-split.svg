<svg width="1100" height="520" viewBox="0 0 1100 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Responsibility Split</title>
  <desc id="desc">Diagram separating LLM, user, and deterministic code responsibilities.</desc>
  <defs>
    <style>
      .col1 { fill:#eef2ff; stroke:#4f46e5; stroke-width:2; rx:18; }
      .col2 { fill:#f0fdf4; stroke:#16a34a; stroke-width:2; rx:18; }
      .col3 { fill:#fff7ed; stroke:#ea580c; stroke-width:2; rx:18; }
      .card { fill:#fff; stroke:#cbd5e1; stroke-width:2; rx:12; }
      .head { font:700 22px sans-serif; fill:#0f172a; text-anchor:middle; }
      .label { font:700 15px sans-serif; fill:#0f172a; text-anchor:middle; dominant-baseline:middle; }
      .small { font:12px sans-serif; fill:#475569; text-anchor:middle; dominant-baseline:middle; }
      .no { font:700 13px sans-serif; fill:#dc2626; text-anchor:middle; dominant-baseline:middle; }
      .yes { font:700 13px sans-serif; fill:#16a34a; text-anchor:middle; dominant-baseline:middle; }
    </style>
  </defs>

  <text x="40" y="40" font-family="sans-serif" font-size="22" font-weight="700" fill="#0f172a">책임 분리: LLM은 제안/작성, 사용자는 의미 승인, 코드는 검증/생성</text>

  <rect x="40" y="80" width="320" height="410" class="col1"/>
  <text x="200" y="120" class="head">LLM</text>
  <rect x="70" y="150" width="260" height="72" class="card"/>
  <text x="200" y="176" class="label">Dictionary 후보 생성</text>
  <text x="200" y="199" class="small">필드명/문맥에서 의미 후보 추론</text>
  <rect x="70" y="245" width="260" height="72" class="card"/>
  <text x="200" y="271" class="label">Proto 주석 작성</text>
  <text x="200" y="294" class="small">승인 Dictionary 문구만 사용</text>
  <rect x="70" y="340" width="260" height="72" class="card"/>
  <text x="200" y="366" class="no">금지</text>
  <text x="200" y="389" class="small">승인 없이 새 의미 확정</text>

  <rect x="390" y="80" width="320" height="410" class="col2"/>
  <text x="550" y="120" class="head">사용자 / Domain Owner</text>
  <rect x="420" y="150" width="260" height="72" class="card"/>
  <text x="550" y="176" class="label">Candidate 검토</text>
  <text x="550" y="199" class="small">의미, alias, 금지어 확인</text>
  <rect x="420" y="245" width="260" height="72" class="card"/>
  <text x="550" y="271" class="label">Approved Dictionary 확정</text>
  <text x="550" y="294" class="small">word-dictionary.json 관리</text>
  <rect x="420" y="340" width="260" height="72" class="card"/>
  <text x="550" y="366" class="yes">필수</text>
  <text x="550" y="389" class="small">의미 변경 승인 증적</text>

  <rect x="740" y="80" width="320" height="410" class="col3"/>
  <text x="900" y="120" class="head">결정론적 코드</text>
  <rect x="770" y="150" width="260" height="72" class="card"/>
  <text x="900" y="176" class="label">가드/검증</text>
  <text x="900" y="199" class="small">lint, AST guard, dictionary guard</text>
  <rect x="770" y="245" width="260" height="72" class="card"/>
  <text x="900" y="271" class="label">문서 생성</text>
  <text x="900" y="294" class="small">Buf 또는 deterministic markdown</text>
  <rect x="770" y="340" width="260" height="72" class="card"/>
  <text x="900" y="366" class="yes">재현 가능</text>
  <text x="900" y="389" class="small">동일 입력 → 동일 문서</text>
</svg>

<svg width="1100" height="560" viewBox="0 0 1100 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Semantic Control Model</title>
  <desc id="desc">LLM creates dictionary candidates, user approves semantics, LLM writes comments from approved dictionary, deterministic code generates documents.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker>
    <style>
      .lane { fill:#f8fafc; stroke:#cbd5e1; stroke-width:2; rx:18; }
      .llm { fill:#eef2ff; stroke:#4f46e5; stroke-width:2; rx:14; }
      .human { fill:#f0fdf4; stroke:#16a34a; stroke-width:2; rx:14; }
      .machine { fill:#fff7ed; stroke:#ea580c; stroke-width:2; rx:14; }
      .artifact { fill:#ffffff; stroke:#64748b; stroke-width:2; rx:12; }
      .pageTitle { font:700 22px sans-serif; fill:#0f172a; }
      .laneTitle { font:700 17px sans-serif; fill:#0f172a; }
      .label { font:700 15px sans-serif; fill:#0f172a; text-anchor:middle; dominant-baseline:middle; }
      .small { font:12px sans-serif; fill:#475569; text-anchor:middle; dominant-baseline:middle; }
      .arrow { stroke:#2563eb; stroke-width:3; fill:none; marker-end:url(#arrow-blue); }
      .approve { stroke:#16a34a; stroke-width:3; fill:none; marker-end:url(#arrow-green); }
    </style>
  </defs>

  <text x="40" y="42" class="pageTitle">의미 통제 모델: 추론은 후보까지만, 의미 확정은 사용자 승인</text>

  <rect x="30" y="72" width="1040" height="135" class="lane"/>
  <text x="70" y="105" class="laneTitle">1. Dictionary 생성</text>
  <rect x="180" y="125" width="190" height="58" class="llm"/>
  <text x="275" y="146" class="label">LLM 추론</text>
  <text x="275" y="166" class="small">Proto에서 의미 후보 도출</text>
  <rect x="500" y="125" width="210" height="58" class="artifact"/>
  <text x="605" y="146" class="label">Candidate Dictionary</text>
  <text x="605" y="166" class="small">승인 전 후보</text>
  <path d="M370 154 H500" class="arrow"/>

  <rect x="30" y="232" width="1040" height="135" class="lane"/>
  <text x="70" y="265" class="laneTitle">2. Dictionary 검사/승인</text>
  <rect x="120" y="285" width="190" height="58" class="human"/>
  <text x="215" y="306" class="label">사용자 검토</text>
  <text x="215" y="326" class="small">의미/용어/예시 승인</text>
  <rect x="430" y="285" width="220" height="58" class="artifact"/>
  <text x="540" y="306" class="label">Approved Dictionary</text>
  <text x="540" y="326" class="small">word-dictionary.json</text>
  <rect x="780" y="285" width="180" height="58" class="artifact"/>
  <text x="870" y="306" class="label">Hash / Evidence</text>
  <text x="870" y="326" class="small">변경 관리</text>
  <path d="M310 314 H430" class="approve"/>
  <path d="M650 314 H780" class="approve"/>

  <rect x="30" y="392" width="1040" height="135" class="lane"/>
  <text x="70" y="425" class="laneTitle">3. 주석 작성과 문서 생성</text>
  <rect x="120" y="445" width="210" height="58" class="llm"/>
  <text x="225" y="466" class="label">LLM 주석 작성</text>
  <text x="225" y="486" class="small">Approved Dictionary만 사용</text>
  <rect x="450" y="445" width="190" height="58" class="artifact"/>
  <text x="545" y="466" class="label">Commented Proto</text>
  <text x="545" y="486" class="small">구조 변경 금지</text>
  <rect x="780" y="445" width="220" height="58" class="machine"/>
  <text x="890" y="466" class="label">결정론적 문서 생성</text>
  <text x="890" y="486" class="small">generate-docs / verify</text>
  <path d="M330 474 H450" class="arrow"/>
  <path d="M640 474 H780" class="arrow"/>
</svg>

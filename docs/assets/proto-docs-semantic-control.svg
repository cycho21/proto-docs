<svg width="1100" height="500" viewBox="0 0 1100 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Semantic Control Model</title>
  <desc id="desc">LLM creates dictionary candidates, user approves semantics, LLM writes comments from approved dictionary, deterministic code generates documents.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker>
    <style>
      .lane { fill:#f8fafc; stroke:#cbd5e1; stroke-width:2; rx:18; }
      .llm { fill:#eef2ff; stroke:#4f46e5; stroke-width:2; rx:14; }
      .human { fill:#f0fdf4; stroke:#16a34a; stroke-width:2; rx:14; }
      .machine { fill:#fff7ed; stroke:#ea580c; stroke-width:2; rx:14; }
      .artifact { fill:#ffffff; stroke:#64748b; stroke-width:2; rx:12; }
      .title { font:700 20px sans-serif; fill:#0f172a; }
      .label { font:700 15px sans-serif; fill:#0f172a; text-anchor:middle; dominant-baseline:middle; }
      .small { font:12px sans-serif; fill:#475569; text-anchor:middle; dominant-baseline:middle; }
      .arrow { stroke:#2563eb; stroke-width:3; fill:none; marker-end:url(#arrow-blue); }
      .approve { stroke:#16a34a; stroke-width:3; fill:none; marker-end:url(#arrow-green); }
    </style>
  </defs>

  <text x="40" y="38" class="title">의미 통제 모델: 추론은 후보까지만, 의미 확정은 사용자 승인</text>

  <rect x="30" y="70" width="1040" height="115" class="lane"/>
  <text x="80" y="100" class="title" font-size="16">1. Dictionary 생성</text>
  <rect x="210" y="92" width="180" height="64" class="llm"/>
  <text x="300" y="116" class="label">LLM 추론</text>
  <text x="300" y="138" class="small">Proto에서 의미 후보 도출</text>
  <rect x="510" y="92" width="190" height="64" class="artifact"/>
  <text x="605" y="116" class="label">Candidate Dictionary</text>
  <text x="605" y="138" class="small">승인 전 후보</text>
  <path d="M390 124 H510" class="arrow"/>

  <rect x="30" y="205" width="1040" height="115" class="lane"/>
  <text x="80" y="235" class="title" font-size="16">2. Dictionary 검사/승인</text>
  <rect x="210" y="227" width="180" height="64" class="human"/>
  <text x="300" y="251" class="label">사용자 검토</text>
  <text x="300" y="273" class="small">의미/용어/예시 승인</text>
  <rect x="510" y="227" width="190" height="64" class="artifact"/>
  <text x="605" y="251" class="label">Approved Dictionary</text>
  <text x="605" y="273" class="small">word-dictionary.json</text>
  <rect x="790" y="227" width="160" height="64" class="artifact"/>
  <text x="870" y="251" class="label">Hash / Evidence</text>
  <text x="870" y="273" class="small">변경 관리</text>
  <path d="M390 259 H510" class="approve"/>
  <path d="M700 259 H790" class="approve"/>

  <rect x="30" y="340" width="1040" height="115" class="lane"/>
  <text x="80" y="370" class="title" font-size="16">3. 주석 작성과 문서 생성</text>
  <rect x="210" y="362" width="180" height="64" class="llm"/>
  <text x="300" y="386" class="label">LLM 주석 작성</text>
  <text x="300" y="408" class="small">Approved Dictionary만 사용</text>
  <rect x="510" y="362" width="170" height="64" class="artifact"/>
  <text x="595" y="386" class="label">Commented Proto</text>
  <text x="595" y="408" class="small">구조 변경 금지</text>
  <rect x="790" y="362" width="180" height="64" class="machine"/>
  <text x="880" y="386" class="label">결정론적 문서 생성</text>
  <text x="880" y="408" class="small">generate-docs / verify</text>
  <path d="M390 394 H510" class="arrow"/>
  <path d="M680 394 H790" class="arrow"/>
</svg>

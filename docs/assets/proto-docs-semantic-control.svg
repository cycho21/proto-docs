<svg width="1200" height="660" viewBox="0 0 1200 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Semantic Control Model</title>
  <desc id="desc">LLM creates dictionary candidates, user approves semantics, LLM writes comments from approved dictionary, deterministic code generates documents.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker>
    <style>
      .lane { fill:#f8fafc; stroke:#cbd5e1; stroke-width:2; rx:20; }
      .llm { fill:#eef2ff; stroke:#4f46e5; stroke-width:2; rx:14; }
      .human { fill:#f0fdf4; stroke:#16a34a; stroke-width:2; rx:14; }
      .machine { fill:#fff7ed; stroke:#ea580c; stroke-width:2; rx:14; }
      .artifact { fill:#ffffff; stroke:#64748b; stroke-width:2; rx:12; }
      .pageTitle { font:700 24px Arial, sans-serif; fill:#0f172a; }
      .stepTitle { font:700 19px Arial, sans-serif; fill:#0f172a; }
      .label { font:700 16px Arial, sans-serif; fill:#0f172a; text-anchor:middle; dominant-baseline:middle; }
      .small { font:13px Arial, sans-serif; fill:#475569; text-anchor:middle; dominant-baseline:middle; }
      .arrow { stroke:#2563eb; stroke-width:3; fill:none; marker-end:url(#arrow-blue); }
      .approve { stroke:#16a34a; stroke-width:3; fill:none; marker-end:url(#arrow-green); }
    </style>
  </defs>

  <text x="48" y="48" class="pageTitle">의미 통제 모델: 추론은 후보까지만, 의미 확정은 사용자 승인</text>

  <rect x="40" y="86" width="1120" height="160" class="lane"/>
  <text x="72" y="122" class="stepTitle">1. Dictionary 생성</text>
  <rect x="270" y="150" width="220" height="64" class="llm"/>
  <text x="380" y="174" class="label">LLM 추론</text>
  <text x="380" y="197" class="small">Proto에서 의미 후보 도출</text>
  <rect x="700" y="150" width="250" height="64" class="artifact"/>
  <text x="825" y="174" class="label">Candidate Dictionary</text>
  <text x="825" y="197" class="small">승인 전 후보</text>
  <path d="M490 182 H700" class="arrow"/>

  <rect x="40" y="286" width="1120" height="160" class="lane"/>
  <text x="72" y="322" class="stepTitle">2. Dictionary 검사/승인</text>
  <rect x="180" y="350" width="220" height="64" class="human"/>
  <text x="290" y="374" class="label">사용자 검토</text>
  <text x="290" y="397" class="small">의미/용어/예시 승인</text>
  <rect x="540" y="350" width="250" height="64" class="artifact"/>
  <text x="665" y="374" class="label">Approved Dictionary</text>
  <text x="665" y="397" class="small">word-dictionary.json</text>
  <rect x="900" y="350" width="190" height="64" class="artifact"/>
  <text x="995" y="374" class="label">Hash / Evidence</text>
  <text x="995" y="397" class="small">변경 관리</text>
  <path d="M400 382 H540" class="approve"/>
  <path d="M790 382 H900" class="approve"/>

  <rect x="40" y="486" width="1120" height="160" class="lane"/>
  <text x="72" y="522" class="stepTitle">3. 주석 작성과 문서 생성</text>
  <rect x="180" y="550" width="240" height="64" class="llm"/>
  <text x="300" y="574" class="label">LLM 주석 작성</text>
  <text x="300" y="597" class="small">Approved Dictionary만 사용</text>
  <rect x="560" y="550" width="220" height="64" class="artifact"/>
  <text x="670" y="574" class="label">Commented Proto</text>
  <text x="670" y="597" class="small">구조 변경 금지</text>
  <rect x="900" y="550" width="230" height="64" class="machine"/>
  <text x="1015" y="574" class="label">결정론적 문서 생성</text>
  <text x="1015" y="597" class="small">generate-docs / verify</text>
  <path d="M420 582 H560" class="arrow"/>
  <path d="M780 582 H900" class="arrow"/>
</svg>

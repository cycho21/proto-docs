<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Semantic Control Model</title>
  <desc id="desc">LLM creates dictionary candidates, user approves semantics, LLM writes comments from approved dictionary, deterministic code generates documents.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker>
    <style>
      .lane { fill:#f8fafc; stroke:#cbd5e1; stroke-width:2; rx:20; }
      .stepBadge1 { fill:#dbeafe; stroke:#2563eb; stroke-width:2; rx:14; }
      .stepBadge2 { fill:#dcfce7; stroke:#16a34a; stroke-width:2; rx:14; }
      .stepBadge3 { fill:#ffedd5; stroke:#ea580c; stroke-width:2; rx:14; }
      .llm { fill:#eef2ff; stroke:#4f46e5; stroke-width:2; rx:14; }
      .human { fill:#f0fdf4; stroke:#16a34a; stroke-width:2; rx:14; }
      .machine { fill:#fff7ed; stroke:#ea580c; stroke-width:2; rx:14; }
      .artifact { fill:#ffffff; stroke:#64748b; stroke-width:2; rx:12; }
      .pageTitle { font:700 24px Arial, sans-serif; fill:#0f172a; }
      .stepTitle { font:700 18px Arial, sans-serif; fill:#0f172a; text-anchor:middle; dominant-baseline:middle; }
      .label { font:700 16px Arial, sans-serif; fill:#0f172a; text-anchor:middle; dominant-baseline:middle; }
      .small { font:13px Arial, sans-serif; fill:#475569; text-anchor:middle; dominant-baseline:middle; }
      .arrow { stroke:#2563eb; stroke-width:3; fill:none; marker-end:url(#arrow-blue); }
      .approve { stroke:#16a34a; stroke-width:3; fill:none; marker-end:url(#arrow-green); }
    </style>
  </defs>

  <text x="48" y="48" class="pageTitle">의미 통제 모델: 추론은 후보까지만, 의미 확정은 사용자 승인</text>

  <rect x="40" y="86" width="1120" height="150" class="lane"/>
  <rect x="70" y="112" width="250" height="54" class="stepBadge1"/>
  <text x="195" y="139" class="stepTitle">1. Dictionary 생성</text>
  <rect x="390" y="122" width="200" height="64" class="llm"/>
  <text x="490" y="146" class="label">LLM 추론</text>
  <text x="490" y="169" class="small">Proto에서 의미 후보 도출</text>
  <rect x="760" y="122" width="230" height="64" class="artifact"/>
  <text x="875" y="146" class="label">Candidate Dictionary</text>
  <text x="875" y="169" class="small">승인 전 후보</text>
  <path d="M590 154 H760" class="arrow"/>

  <rect x="40" y="276" width="1120" height="150" class="lane"/>
  <rect x="70" y="302" width="250" height="54" class="stepBadge2"/>
  <text x="195" y="329" class="stepTitle">2. Dictionary 검사/승인</text>
  <rect x="365" y="312" width="210" height="64" class="human"/>
  <text x="470" y="336" class="label">사용자 검토</text>
  <text x="470" y="359" class="small">의미/용어/예시 승인</text>
  <rect x="675" y="312" width="230" height="64" class="artifact"/>
  <text x="790" y="336" class="label">Approved Dictionary</text>
  <text x="790" y="359" class="small">word-dictionary.json</text>
  <rect x="985" y="312" width="170" height="64" class="artifact"/>
  <text x="1070" y="336" class="label">Hash / Evidence</text>
  <text x="1070" y="359" class="small">변경 관리</text>
  <path d="M575 344 H675" class="approve"/>
  <path d="M905 344 H985" class="approve"/>

  <rect x="40" y="466" width="1120" height="150" class="lane"/>
  <rect x="70" y="492" width="250" height="54" class="stepBadge3"/>
  <text x="195" y="519" class="stepTitle">3. 주석 작성과 문서 생성</text>
  <rect x="365" y="502" width="230" height="64" class="llm"/>
  <text x="480" y="526" class="label">LLM 주석 작성</text>
  <text x="480" y="549" class="small">Approved Dictionary만 사용</text>
  <rect x="705" y="502" width="200" height="64" class="artifact"/>
  <text x="805" y="526" class="label">Commented Proto</text>
  <text x="805" y="549" class="small">구조 변경 금지</text>
  <rect x="985" y="502" width="210" height="64" class="machine"/>
  <text x="1090" y="526" class="label">결정론적 문서 생성</text>
  <text x="1090" y="549" class="small">generate-docs / verify</text>
  <path d="M595 534 H705" class="arrow"/>
  <path d="M905 534 H985" class="arrow"/>
</svg>
